<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem ligação — Selo</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: #f5ead8;
        color: #201e1d;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 30ch;
        font-size: 14px;
        color: #645c50;
        line-height: 1.5;
      }
      button {
        margin-top: 12px;
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        font-size: 14px;
        font-weight: 800;
        color: #f5ead8;
        background: #c67139;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sem ligação</h1>
    <p>
      O Selo precisa de internet para mostrar entregas e confirmações. Os dados não ficam
      guardados no telemóvel, para não mostrar números desatualizados.
    </p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </body>
</html>
