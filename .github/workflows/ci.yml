name: CI

on:
  pull_request:
  push:
    branches: [main]

# This workflow is the authoritative verification gate for this repo. No Docker is
# available on the developer's machine (see docs/mvp-roadmap.md FASE 0 / memory
# feedback-epi-no-docker), so `supabase db reset` + the pgTAP suite run ONLY here --
# nothing about tenant isolation, RLS, or the migration set is trusted until this job is
# green. No migration merges without having been proven against a real, ephemeral
# Postgres carrying the actual `auth` schema, even though no developer machine runs one.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Deliberately no .env and no Supabase/crypto secrets here (audit finding TST-01):
      # every page this suite touches today is unauthenticated and reads no
      # Supabase/crypto secret at build or render time, so a real production build with
      # zero env vars set is exactly the CI-representative case worth proving, not a gap
      # to paper over with fake values. Add a real env var here ONLY alongside a new spec
      # that genuinely needs it -- not preemptively.
      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  database:
    name: Database (migrations from zero + pgTAP suite + real concurrency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply every migration from a clean database + seed
        run: supabase db reset

      - name: Run pgTAP suite (every file under supabase/tests/database -- schema invariants, tenant isolation, and the full A+B+C expansion suite)
        run: supabase test db

      # A+B+C closure-audit Blocker 2: PGlite (used elsewhere for fast local checks) is a
      # single in-process connection and cannot represent real concurrency -- this runs the
      # last-stock-unit race and the concurrent-replacement race against the real ephemeral
      # Postgres this job already started, using two genuinely independent client
      # connections (see scripts/concurrency-test.mjs for the full rationale).
      - name: Real-concurrency tests (two independent Postgres connections)
        run: node scripts/concurrency-test.mjs
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
